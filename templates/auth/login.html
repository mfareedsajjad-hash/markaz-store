{% extends "base.html" %}
{% block title %}Login — Markaz{% endblock %}

{% block content %}
<div class="auth-card">
    <h3 class="fw-bold text-center mb-1">Welcome back</h3>
    <p class="text-muted text-center mb-4">Login to your Markaz account</p>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn w-100 rounded-pill py-2 btn-primary-custom">Login</button>
    </form>
    <p class="text-center mt-3 mb-0 small">
        Don't have an account? <a href="{{ url_for('register') }}" class="fw-medium" style="color:var(--primary);">Register</a>
    </p>
    <hr class="my-3">
    <p class="text-muted small text-center mb-0">
        Demo: demo@markaz.pk / demo123<br>
        Admin: admin@markaz.pk / admin123
    </p>
</div>
{% endblock %}
