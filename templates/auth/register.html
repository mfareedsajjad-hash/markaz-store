{% extends "base.html" %}
{% block title %}Register — Markaz{% endblock %}

{% block content %}
<div class="auth-card">
    <h3 class="fw-bold text-center mb-1">Create Account</h3>
    <p class="text-muted text-center mb-4">Join Markaz and start shopping</p>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Full Name *</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" placeholder="03XX-XXXXXXX">
        </div>
        <div class="mb-3">
            <label class="form-label">Password *</label>
            <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
            <label class="form-label">Confirm Password *</label>
            <input type="password" name="confirm" class="form-control" required>
        </div>
        <button type="submit" class="btn w-100 rounded-pill py-2 btn-primary-custom">Create Account</button>
    </form>
    <p class="text-center mt-3 mb-0 small">
        Already have an account? <a href="{{ url_for('login') }}" class="fw-medium" style="color:var(--primary);">Login</a>
    </p>
</div>
{% endblock %}
